<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локалити</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-light">

    <div class="container mt-4">
        <h1 class="mb-3">Общие файлы</h1>

        <div class="card mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">
                <nav id="breadcrumbs" class="d-flex align-items-center"></nav>

                
                <div>
                    <button id="create-folder-btn" class="btn btn-outline-primary"><i class="bi bi-folder-plus"></i> Создать папку</button>
                </div>
            </div>
        </div>

        <div id="main-drop-zone" class="card text-center p-4 mb-3 border-2 border-dashed">
            <div class="dz-message">
                <i class="bi bi-cloud-arrow-up-fill" style="font-size: 2.5rem;"></i>
                <h5 class="mt-2 mb-0">Перетащите файлы сюда или кликните для выбора</h5>
                <p class="text-muted small mb-0">Можно загружать несколько файлов одновременно</p>
            </div>
        </div>
        
        <div id="loader" class="text-center d-none">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Загрузка ...</span>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header bg-white">
                <div class="row gx-2 text-muted fw-bold">
                    <div class="col-5">
                        <a href="#" class="text-decoration-none text-muted sort-by" data-sort="name">
                            Имя <i class="bi bi-arrow-down-up sort-icon"></i>
                        </a>
                    </div>
                    <div class="col-2">
                        <a href="#" class="text-decoration-none text-muted sort-by" data-sort="extension">
                            Расширение<i class="bi bi-arrow-down-up sort-icon"></i>
                        </a>
                    </div>
                    <div class="col-3">
                        <a href="#" class="text-decoration-none text-muted sort-by" data-sort="date">
                            Дата изменения <i class="bi bi-arrow-down-up sort-icon"></i>
                        </a>
                    </div>
                    <div class="col">
                        <a href="#" class="text-decoration-none text-muted sort-by" data-sort="size">
                            Размер <i class="bi bi-arrow-down-up sort-icon"></i>
                        </a>
                    </div>
                </div>
            </div>
            <div id="file-list-container">
            </div>
        </div>

        <div id="empty-folder-message" class="text-center text-muted mt-5 d-none">
            <h4>Папка пуста</h4>
            <p>Добавьте файл или создайте папку</p>
        </div>
    </div>

        <div class="modal fade" id="createFolderModal" tabindex="-1" aria-labelledby="createFolderModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createFolderModalLabel">Создать новую папку</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="create-folder-form">
                            <div class="mb-3">
                                <label for="newFolderName" class="form-label">Имя папки:</label>
                                <input type="text" class="form-control" id="newFolderName" required autocomplete="off">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="button" class="btn btn-primary" id="confirmCreateFolderBtn">Создать</button>
                    </div>
                </div>
            </div>
        </div>
    
        <div class="modal fade" id="uploadFileModal" tabindex="-1" aria-labelledby="uploadFileModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="uploadFileModalLabel">Загрузить файл</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="drop-zone" class="drop-zone">
                            <p class="text-center text-muted">Перетащите файл сюда или нажмите, чтобы выбрать</p>
                        </div>
                        <input type="file" id="file-input" style="display: none;">
                        <p id="file-upload-status" class="mt-2 text-center"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="button" class="btn btn-primary" id="confirmUploadBtn" disabled>Загрузить</button>
                    </div>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
